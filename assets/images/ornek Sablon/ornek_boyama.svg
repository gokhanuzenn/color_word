  <polygon points="280,450 425,300 570,450" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- EV - Kapı -->
  <rect x="390" y="530" width="70" height="120" fill="none" stroke="black" stroke-width="4"/>
