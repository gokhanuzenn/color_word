  <line x1="0" y1="650" x2="800" y2="650" stroke="black" stroke-width="4"/>
  
  <!-- ÇİMEN DETAYLARI -->
  <path d="M50,650 Q55,630 60,650" fill="none" stroke="black" stroke-width="3"/>
  <path d="M150,650 Q155,625 160,650" fill="none" stroke="black" stroke-width="3"/>
  <path d="M250,650 Q255,635 260,650" fill="none" stroke="black" stroke-width="3"/>
