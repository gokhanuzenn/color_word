  <line x1="572" y1="228" x2="550" y2="250" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="728" y1="228" x2="750" y2="250" stroke="black" stroke-width="4" stroke-linecap="round"/>
  
