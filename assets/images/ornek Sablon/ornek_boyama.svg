  <rect x="475" y="490" width="55" height="55" fill="none" stroke="black" stroke-width="4"/>
  <line x1="502.5" y1="490" x2="502.5" y2="545" stroke="black" stroke-width="3"/>
  <line x1="475" y1="517.5" x2="530" y2="517.5" stroke="black" stroke-width="3"/>
  
